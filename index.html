<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tetris</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="wrapper">
    <h1 class="game-title">TETRIS</h1>
    <div class="game-container">
      <canvas id="board" width="300" height="600"></canvas>

      <aside class="panel">
        <div class="panel-section theme-toggle">
          <span class="label">MODO CLARO</span>
          <label class="switch">
            <input type="checkbox" id="theme-toggle" />
            <span class="slider"></span>
          </label>
        </div>

        <div class="panel-section">
          <span class="label">SCORE</span>
          <span class="value" id="score">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LINES</span>
          <span class="value" id="lines">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LEVEL</span>
          <span class="value" id="level">1</span>
        </div>

        <div class="panel-section">
          <span class="label">NEXT</span>
          <canvas id="next-canvas" width="120" height="120"></canvas>
        </div>

        <div class="panel-section leaderboard-section">
          <span class="label">TOP 5</span>
          <ol class="leaderboard-list" id="leaderboard-list">
            <li class="leaderboard-empty">No hay records aún</li>
          </ol>
          <div class="leaderboard-stats">
            <div class="leaderboard-stat">
              <span class="label">MEJOR COMBO</span>
              <span class="value leaderboard-stat-value" id="best-combo">0</span>
            </div>
            <div class="leaderboard-stat">
              <span class="label">MÁX. LÍNEAS</span>
              <span class="value leaderboard-stat-value" id="max-lines">0</span>
            </div>
          </div>
          <button id="reset-leaderboard-btn" type="button">Resetear records</button>
        </div>

        <div class="panel-section controls">
          <span class="label">CONTROLS</span>
          <ul>
            <li><kbd>←</kbd><kbd>→</kbd> mover</li>
            <li><kbd>↑</kbd> rotar</li>
            <li><kbd>↓</kbd> bajar</li>
            <li><kbd>Space</kbd> caída</li>
            <li><kbd>P</kbd> pausa</li>
          </ul>
        </div>
      </aside>
    </div>

    <div id="overlay" class="overlay hidden">
      <div class="overlay-box">
        <p id="overlay-title">GAME OVER</p>
        <p id="overlay-score"></p>
        <div id="new-record-box" class="new-record-box hidden">
          <label for="player-name-input" class="label">¡Nuevo record! Ingresa tu nombre</label>
          <input type="text" id="player-name-input" maxlength="12" placeholder="Jugador" />
          <button id="save-record-btn" type="button">Guardar</button>
        </div>
        <button id="restart-btn">Reiniciar</button>
      </div>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
